<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Swipe Tasks">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EDF0F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1318" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Swipe Tasks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: one scrolling column of task cards under a large title; the Add task button is pinned to the bottom edge, where the thumb rests. */
:root {
  --bg: #EDF0F4; --card: #FFFFFF; --ink: #16212C; --muted: #5B6874; --line: #DCE2E9; --ring: #98A4B0;
  --done: #168A5A; --done-on: #FFFFFF;
  --part: #E9A21B; --part-on: #2B1B00; --part-bg: #FBEFD3; --part-ink: #7A5200;
  --wait: #4A74E0; --wait-bg: #E4ECFC; --wait-ink: #2B4A9C;
  --danger: #C23636;
  --btn: #16212C; --btn-ink: #FFFFFF;
  --toast: #16212C; --toast-ink: #F3F6F9; --toast-link: #7FE0B4;
  --font-display: "Bricolage Grotesque", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1318; --card: #171D24; --ink: #EAF0F5; --muted: #92A0AD; --line: #262E37; --ring: #6C7986;
    --done: #2BC088; --done-on: #04261A;
    --part: #F2B23E; --part-on: #2B1B00; --part-bg: #33280E; --part-ink: #F6D58B;
    --wait: #7C9CF2; --wait-bg: #1B2540; --wait-ink: #B7C9FA;
    --danger: #F27A7A;
    --btn: #EAF0F5; --btn-ink: #0E1318;
    --toast: #EAF0F5; --toast-ink: #0E1318; --toast-link: #0F7A50;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1318; --card: #171D24; --ink: #EAF0F5; --muted: #92A0AD; --line: #262E37; --ring: #6C7986;
  --done: #2BC088; --done-on: #04261A;
  --part: #F2B23E; --part-on: #2B1B00; --part-bg: #33280E; --part-ink: #F6D58B;
  --wait: #7C9CF2; --wait-bg: #1B2540; --wait-ink: #B7C9FA;
  --danger: #F27A7A;
  --btn: #EAF0F5; --btn-ink: #0E1318;
  --toast: #EAF0F5; --toast-ink: #0E1318; --toast-link: #0F7A50;
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--ink); font: 16px/1.35 var(--font-ui); -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--wait); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 150px;
  overflow-x: clip;
}

/* Header */
.top { padding: 10px 4px 18px; }
.date { margin: 0; color: var(--muted); font-size: 15px; }
h1 { margin: 2px 0 4px; font: 700 42px/1.05 var(--font-display); letter-spacing: -0.025em; }
.count { width: fit-content; max-width: 100%; margin: 0; color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; transform-origin: left center; }
.count.bump { animation: bump .5s ease-out; }

/* List and rows */
.list { list-style: none; margin: 0; padding: 0; }
.item { padding-bottom: 8px; overflow: hidden; transition: height .3s cubic-bezier(.4, 0, .2, 1), padding-bottom .3s, opacity .25s; }
.item.enter { animation: enter .26s ease-out; }
.item.leaving { pointer-events: none; }
.item.collapse { height: 0 !important; padding-bottom: 0; opacity: 0; }

.row { position: relative; border-radius: 18px; overflow: hidden; background: var(--card); isolation: isolate; }

.act { position: absolute; inset: 0; z-index: 0; display: flex; align-items: center; border: 0; margin: 0; padding: 0; visibility: hidden; cursor: pointer; }
.act-part { justify-content: flex-start; background: var(--part); color: var(--part-on); }
.act-done { justify-content: flex-end; background: var(--done); color: var(--done-on); }
.row[data-dir="r"] .act-part, .row[data-dir="l"] .act-done { visibility: visible; }
.act-in { width: 132px; display: flex; flex-direction: column; align-items: center; gap: 4px; font: 600 14px/1.15 var(--font-ui); transition: transform .3s cubic-bezier(.2, .8, .2, 1); }
.act-in svg { width: 26px; height: 26px; }
.chk path { stroke-dasharray: 1; stroke-dashoffset: 0; }
.row.armed .act-in svg { transform: scale(1.18); }
.act-in svg { transition: transform .15s; }

.row.celebrate .act-done { visibility: visible; }
.row.celebrate .act-in { width: auto; flex-direction: row; gap: 10px; font-size: 19px; transform: translateX(calc(var(--shift, 0px) * -1)); }
.row.celebrate .act-in svg { width: 32px; height: 32px; animation: pop .5s .08s both cubic-bezier(.3, 1.5, .5, 1); }
.row.celebrate .chk path { animation: draw .32s .14s both ease-out; }

.card {
  position: relative; z-index: 1; display: flex; align-items: flex-start; gap: 2px;
  min-height: 64px; padding: 6px 14px 6px 6px; border-radius: 18px;
  background: var(--card); box-shadow: inset 0 0 0 1px var(--line);
  touch-action: pan-y; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  transition: transform .3s cubic-bezier(.2, .8, .2, 1);
}
.item.dragging .card { transition: none; }

.dot { flex: none; width: 44px; height: 44px; display: grid; place-items: center; padding: 0; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
.dot svg { width: 28px; height: 28px; }

.main { flex: 1; min-width: 0; padding: 10px 0 10px 2px; cursor: pointer; }
.title { font: 500 18px/1.3 var(--font-display); letter-spacing: -0.005em; overflow-wrap: anywhere; }
.title input {
  width: 100%; padding: 0; border: 0; outline: 0; background: none; color: inherit;
  font: inherit; letter-spacing: inherit; caret-color: var(--wait); -webkit-user-select: text; user-select: text;
}
.title input::placeholder { color: var(--muted); opacity: 1; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-top: 6px; color: var(--muted); font-size: 14px; }
.meta:empty { display: none; }
.chip { padding: 2px 9px; border-radius: 999px; font-size: 13px; font-weight: 600; }
.chip-partial { background: var(--part-bg); color: var(--part-ink); }
.chip-waiting { background: var(--wait-bg); color: var(--wait-ink); }
.note { min-width: 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }

/* Empty state */
.empty { padding: 56px 8px 0; }
.empty-title { margin: 0 0 6px; font: 700 24px/1.15 var(--font-display); letter-spacing: -0.015em; }
.empty-text { margin: 0; max-width: 30ch; color: var(--muted); font-size: 16px; }

/* Bottom bar and toast */
.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  padding: 22px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: linear-gradient(to top, var(--bg) 70%, transparent);
}
.bar-in { position: relative; max-width: 560px; margin: 0 auto; }
.add {
  display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 56px;
  border: 0; border-radius: 28px; background: var(--btn); color: var(--btn-ink);
  font: 600 18px var(--font-display); letter-spacing: -0.005em; cursor: pointer; touch-action: manipulation;
  transition: transform .12s;
}
.add:active { transform: scale(.98); }
.add svg { width: 20px; height: 20px; }

.toast {
  position: absolute; left: 0; right: 0; bottom: calc(100% + 8px);
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px 8px 10px 16px; border-radius: 14px; background: var(--toast); color: var(--toast-ink); font-size: 15px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, .18);
  opacity: 0; transform: translateY(8px); visibility: hidden;
  transition: opacity .2s, transform .2s, visibility 0s .2s;
}
.toast.show { opacity: 1; transform: none; visibility: visible; transition: opacity .2s, transform .2s; }
.toast span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toast button { flex: none; padding: 8px 10px; border: 0; background: none; color: var(--toast-link); font-weight: 700; cursor: pointer; }
.toast button[hidden] { display: none; }

/* Details sheet */
.scrim { position: fixed; inset: 0; z-index: 30; background: rgba(10, 16, 22, .45); opacity: 0; visibility: hidden; transition: opacity .25s, visibility 0s .25s; }
.scrim.open { opacity: 1; visibility: visible; transition: opacity .25s; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; max-width: 560px; margin: 0 auto; max-height: 92%; overflow: auto;
  padding: 8px max(20px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
  border-radius: 24px 24px 0 0; background: var(--card); box-shadow: 0 -10px 40px rgba(0, 0, 0, .2);
  transform: translateY(105%); visibility: hidden; transition: transform .32s cubic-bezier(.2, .8, .2, 1), visibility 0s .32s;
}
.sheet.open { transform: none; visibility: visible; transition: transform .32s cubic-bezier(.2, .8, .2, 1); }
.sheet-top { position: relative; display: flex; justify-content: flex-end; align-items: center; min-height: 40px; }
.sheet-top::before { content: ""; position: absolute; left: 50%; top: 6px; width: 38px; height: 5px; margin-left: -19px; border-radius: 3px; background: var(--line); }
.link { padding: 8px 4px; border: 0; background: none; font-weight: 600; font-size: 16px; cursor: pointer; }
.link.danger { color: var(--danger); }
.label { display: block; margin: 16px 0 6px; color: var(--muted); font-size: 13px; font-weight: 600; }
.sheet input[type="text"], .sheet textarea {
  display: block; width: 100%; padding: 12px 14px; border: 0; border-radius: 12px; background: var(--bg); color: var(--ink); outline-offset: 0; resize: none;
}
.sheet textarea { font: 16px/1.4 var(--font-ui); }
.sheet #s-title { font: 500 20px/1.3 var(--font-display); overflow: hidden; }
.sheet input::placeholder, .sheet textarea::placeholder { color: var(--muted); opacity: 1; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; margin: 0; padding: 3px; border: 0; border-radius: 13px; background: var(--bg); }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; }
.seg span { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 0 6px; border-radius: 10px; font-size: 14px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.seg span::before { content: ""; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--ring); }
.seg label:nth-child(2) span::before { border-color: var(--part); background: linear-gradient(90deg, var(--part) 50%, transparent 50%); }
.seg label:nth-child(3) span::before { border-color: var(--wait); }
.seg input:checked + span { background: var(--card); color: var(--ink); box-shadow: 0 0 0 1px var(--line), 0 1px 3px rgba(0, 0, 0, .08); }
.seg input:focus-visible + span { outline: 2px solid var(--wait); }
.sheet-actions { display: grid; gap: 4px; margin-top: 20px; }
.btn-done {
  display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; border: 0; border-radius: 26px;
  background: var(--done); color: var(--done-on); font: 600 17px var(--font-display); cursor: pointer;
}
.btn-done svg { width: 22px; height: 22px; }

#confetti { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 60; pointer-events: none; }

@keyframes enter { from { opacity: 0; transform: translateY(-6px); } }
@keyframes bump { 40% { transform: scale(1.07); color: var(--done); } }
@keyframes pop { 0% { transform: scale(.4); } 55% { transform: scale(1.5) rotate(-8deg); } 100% { transform: scale(1.15); } }
@keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <p class="date" id="date"></p>
    <h1>Tasks</h1>
    <p class="count" id="count" aria-live="polite"></p>
  </header>

  <ul class="list" id="list"></ul>

  <div class="empty" id="empty" hidden>
    <p class="empty-title">Nothing left to do.</p>
    <p class="empty-text">Tap Add task to write the next one. Swipe a task left when it is finished.</p>
  </div>
</div>

<div class="bar">
  <div class="bar-in">
    <div class="toast" id="toast" role="status" aria-live="polite">
      <span id="toast-msg"></span>
      <button type="button" id="toast-act" hidden></button>
    </div>
    <button type="button" class="add" id="add">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v14M3 10h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      Add task
    </button>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Task details">
  <div class="sheet-top"><button type="button" class="link" id="sheet-close">Done</button></div>
  <label class="label" for="s-title">Task</label>
  <textarea id="s-title" rows="1" maxlength="140" autocomplete="off" enterkeyhint="done"></textarea>
  <span class="label" id="s-state-label">Status</span>
  <fieldset class="seg" aria-labelledby="s-state-label">
    <label><input type="radio" name="st" value="todo"><span>To do</span></label>
    <label><input type="radio" name="st" value="partial"><span>Partly done</span></label>
    <label><input type="radio" name="st" value="waiting"><span>Waiting</span></label>
  </fieldset>
  <label class="label" for="s-note">Note</label>
  <textarea id="s-note" rows="3" maxlength="400" placeholder="What is left to do?"></textarea>
  <div class="sheet-actions">
    <button type="button" class="btn-done" id="s-finish">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Task finished!
    </button>
    <button type="button" class="link danger" id="s-delete">Delete task</button>
  </div>
</section>

<canvas id="confetti" aria-hidden="true"></canvas>

<script>
(() => {
  'use strict';

  const KEY = 'swipe-tasks.v1';
  const OPEN_W = 132;      // width of the revealed "Task finished!" button
  const FULL_RATIO = 0.5;  // swipe past half the row to finish without tapping
  const PART_AT = 88;      // swipe right this far to toggle partly done
  const LABEL = { todo: 'To do', partial: 'Partly done', waiting: 'Waiting' };
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = (s, r = document) => r.querySelector(s);
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

  /* ---------- Storage ---------- */
  function seed() {
    const now = Date.now();
    return {
      tasks: [
        { id: uid(), title: 'Swipe this task left to finish it', state: 'todo', note: '', created: now },
        { id: uid(), title: 'Tap the circle to mark a task partly done', state: 'todo', note: '', created: now },
        { id: uid(), title: 'Send the documents to the accountant', state: 'partial', note: 'ID sent. Still need the tax notice.', created: now }
      ],
      done: []
    };
  }
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return null;
      const d = JSON.parse(raw);
      if (!d || !Array.isArray(d.tasks)) return null;
      return {
        tasks: d.tasks.map(t => ({
          id: String(t.id || uid()), title: String(t.title || ''),
          state: LABEL[t.state] ? t.state : 'todo', note: String(t.note || ''), created: t.created || Date.now()
        })),
        done: Array.isArray(d.done) ? d.done : []
      };
    } catch (e) { return null; }
  }
  let state = load() || seed();
  function persist() {
    try {
      localStorage.setItem(KEY, JSON.stringify({
        tasks: state.tasks.filter(t => t.title.trim() !== ''),
        done: state.done.slice(-300)
      }));
    } catch (e) { /* storage unavailable: the app still works for this session */ }
  }
  persist();

  /* ---------- Elements and helpers ---------- */
  const list = $('#list'), emptyEl = $('#empty'), countEl = $('#count');
  const rows = new Map();
  let editingId = null, openRow = null, sheetId = null, lastRemoved = null, suppressClick = false;
  const find = id => state.tasks.find(t => t.id === id);

  const ICON_CHECK = '<svg class="chk" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/></svg>';
  const ICON_HALF = '<svg viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="11" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M14 6.5A7.5 7.5 0 0 0 14 21.5Z" fill="currentColor"/></svg>';
  function dotSvg(s) {
    if (s === 'partial') return '<svg viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="11" fill="none" stroke="var(--part)" stroke-width="2.5"/><path d="M14 6.5A7.5 7.5 0 0 0 14 21.5Z" fill="var(--part)"/></svg>';
    if (s === 'waiting') return '<svg viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="11" fill="none" stroke="var(--wait)" stroke-width="2.5"/><path d="M14 8.5V14l3.6 2.3" fill="none" stroke="var(--wait)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    return '<svg viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="11" fill="none" stroke="var(--ring)" stroke-width="2.5"/></svg>';
  }
  const short = s => (s.length > 28 ? s.slice(0, 27).trimEnd() + '…' : s);

  /* ---------- Rendering ---------- */
  function createRow(t) {
    const li = document.createElement('li');
    li.className = 'item';
    li.dataset.id = t.id;
    li.innerHTML =
      '<div class="row">' +
        '<button type="button" class="act act-part" tabindex="-1" aria-hidden="true"><span class="act-in">' + ICON_HALF + '<span class="act-label">Partly done</span></span></button>' +
        '<button type="button" class="act act-done" tabindex="-1" aria-label="Task finished"><span class="act-in">' + ICON_CHECK + '<span class="act-label">Task finished!</span></span></button>' +
        '<div class="card">' +
          '<button type="button" class="dot"></button>' +
          '<div class="main"><div class="title"></div><div class="meta"></div></div>' +
        '</div>' +
      '</div>';
    return li;
  }

  function updateRow(li, t) {
    li.dataset.state = t.state;
    const dot = $('.dot', li);
    dot.innerHTML = dotSvg(t.state);
    dot.setAttribute('aria-label', LABEL[t.state] + '. Tap to ' + (t.state === 'partial' ? 'set back to to do' : 'mark as partly done'));
    $('.act-part .act-label', li).textContent = t.state === 'partial' ? 'Back to to do' : 'Partly done';

    const titleEl = $('.title', li);
    if (editingId === t.id) {
      if (!$('input', titleEl)) {
        titleEl.textContent = '';
        const inp = document.createElement('input');
        inp.type = 'text'; inp.placeholder = 'New task'; inp.maxLength = 140; inp.autocomplete = 'off';
        inp.enterKeyHint = 'done'; inp.setAttribute('aria-label', 'Task name');
        let cancelled = false;
        inp.addEventListener('keydown', e => {
          if (e.key === 'Enter') { e.preventDefault(); inp.blur(); }
          else if (e.key === 'Escape') { cancelled = true; inp.blur(); }
        });
        inp.addEventListener('blur', () => { if (editingId === t.id) endEdit(t, inp.value, cancelled); });
        titleEl.appendChild(inp);
      }
    } else {
      titleEl.textContent = t.title;
    }

    const meta = $('.meta', li);
    meta.textContent = '';
    if (t.state !== 'todo') {
      const c = document.createElement('span');
      c.className = 'chip chip-' + t.state; c.textContent = LABEL[t.state];
      meta.appendChild(c);
    }
    if (t.note.trim()) {
      const n = document.createElement('span');
      n.className = 'note'; n.textContent = t.note.trim();
      meta.appendChild(n);
    }
  }

  function render() {
    const ids = new Set(state.tasks.map(t => t.id));
    rows.forEach((li, id) => { if (!ids.has(id)) { li.remove(); rows.delete(id); } });
    let prev = null;
    state.tasks.forEach(t => {
      let li = rows.get(t.id);
      if (!li) { li = createRow(t); li.classList.add('enter'); rows.set(t.id, li); }
      updateRow(li, t);
      const ref = prev ? prev.nextSibling : list.firstChild;
      if (li !== ref) list.insertBefore(li, ref);
      prev = li;
    });
    syncEmpty();
    updateCounts();
  }
  function syncEmpty() { emptyEl.hidden = state.tasks.length > 0; }

  function updateCounts(bump) {
    const open = state.tasks.filter(t => t.title.trim()).length;
    const start = new Date(); start.setHours(0, 0, 0, 0);
    const n = state.done.filter(d => d.ts >= start.getTime()).length;
    countEl.textContent = open + ' open' + (n ? ', ' + n + ' finished today' : '');
    if (bump && !reduce) { countEl.classList.remove('bump'); void countEl.offsetWidth; countEl.classList.add('bump'); }
  }
  function renderDate() {
    $('#date').textContent = new Intl.DateTimeFormat('en-GB', { weekday: 'long', day: 'numeric', month: 'long' }).format(new Date());
    updateCounts();
  }

  /* ---------- Add and edit ---------- */
  $('#add').addEventListener('click', () => {
    if (sheetId) closeSheet();
    closeOpenRow();
    if (editingId) { const cur = $('.title input'); if (cur) cur.blur(); }
    const t = { id: uid(), title: '', state: 'todo', note: '', created: Date.now() };
    state.tasks.unshift(t);
    editingId = t.id;
    render();
    window.scrollTo(0, 0);
    const inp = $('.title input', rows.get(t.id));
    if (inp) inp.focus({ preventScroll: true });
  });

  function endEdit(t, value, cancelled) {
    editingId = null;
    const v = value.trim();
    if (cancelled || !v) {
      state.tasks = state.tasks.filter(x => x !== t);
    } else {
      t.title = v;
    }
    persist();
    render();
  }

  /* ---------- Swipe gestures ---------- */
  let drag = null;
  const rowOf = li => $('.row', li), cardOf = li => $('.card', li);

  function setDir(li, dir) { rowOf(li).dataset.dir = dir; }
  function hideLayersLater(li) {
    setTimeout(() => {
      if (li !== openRow && !li.classList.contains('dragging') && !li.classList.contains('leaving')) setDir(li, '');
    }, 340);
  }
  function closeRow(li) {
    if (!li) return;
    cardOf(li).style.transform = '';
    rowOf(li).classList.remove('armed');
    if (openRow === li) openRow = null;
    hideLayersLater(li);
  }
  function closeOpenRow() { if (openRow) closeRow(openRow); }
  function openRowAt(li) {
    cardOf(li).style.transform = 'translateX(' + (-OPEN_W) + 'px)';
    setDir(li, 'l');
    openRow = li;
  }

  list.addEventListener('pointerdown', e => {
    const card = e.target.closest('.card');
    if (!card || e.target.closest('input')) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const li = card.closest('.item');
    if (li.classList.contains('leaving')) return;
    if (openRow && openRow !== li) closeRow(openRow);
    drag = { li, card, id: li.dataset.id, pid: e.pointerId, x0: e.clientX, y0: e.clientY, base: li === openRow ? -OPEN_W : 0, w: li.offsetWidth, x: li === openRow ? -OPEN_W : 0, active: false };
  });

  list.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.pid) return;
    const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
    if (!drag.active) {
      if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy) * 1.3) {
        drag.active = true;
        try { drag.card.setPointerCapture(e.pointerId); } catch (_) {}
        drag.li.classList.add('dragging');
      } else if (Math.abs(dy) > 8) { drag = null; return; }
      else return;
    }
    const x = Math.max(-drag.w, Math.min(150, drag.base + dx));
    drag.x = x;
    drag.card.style.transform = 'translateX(' + x + 'px)';
    setDir(drag.li, x < 0 ? 'l' : 'r');
    rowOf(drag.li).classList.toggle('armed', x <= -drag.w * FULL_RATIO || x >= PART_AT);
  });

  function endDrag(e) {
    if (!drag || e.pointerId !== drag.pid) return;
    const d = drag; drag = null;
    if (!d.active) return;
    suppressClick = true; setTimeout(() => { suppressClick = false; }, 80);
    d.li.classList.remove('dragging');
    rowOf(d.li).classList.remove('armed');
    if (e.type === 'pointercancel') { closeRow(d.li); return; }
    if (d.x <= -d.w * FULL_RATIO) finish(d.id);
    else if (d.x <= -56) openRowAt(d.li);
    else if (d.x >= PART_AT) { closeRow(d.li); togglePartial(d.id); }
    else closeRow(d.li);
  }
  list.addEventListener('pointerup', endDrag);
  list.addEventListener('pointercancel', endDrag);
  document.addEventListener('click', e => { if (suppressClick) { e.stopPropagation(); e.preventDefault(); } }, true);
  document.addEventListener('pointerdown', e => { if (openRow && !openRow.contains(e.target)) closeRow(openRow); });

  list.addEventListener('click', e => {
    const li = e.target.closest('.item');
    if (!li || li.classList.contains('leaving')) return;
    const id = li.dataset.id;
    if (e.target.closest('.act-done')) { finish(id); return; }
    if (e.target.closest('.dot')) { togglePartial(id); return; }
    if (e.target.closest('input')) return;
    if (e.target.closest('.main') || e.target.closest('.card')) {
      if (li === openRow) { closeRow(li); return; }
      openSheet(id);
    }
  });

  /* ---------- Actions ---------- */
  function togglePartial(id) {
    const t = find(id); if (!t) return;
    t.state = t.state === 'partial' ? 'todo' : 'partial';
    persist(); updateRow(rows.get(id), t);
    if (t.state === 'partial') toast('Marked partly done', t.note.trim() ? '' : 'Add note', () => openSheet(id, true));
    else toast('Back to to do');
  }

  function finish(id) {
    const t = find(id); if (!t) return;
    const li = rows.get(id); if (!li) return;
    const idx = state.tasks.indexOf(t);
    state.tasks.splice(idx, 1);
    const entry = { id: t.id, title: t.title, ts: Date.now() };
    state.done.push(entry);
    lastRemoved = { task: t, idx, doneId: t.id };
    persist();
    rows.delete(id);
    if (openRow === li) openRow = null;
    if (editingId === id) editingId = null;

    li.classList.add('leaving');
    const row = rowOf(li);
    row.dataset.dir = 'l';
    row.style.setProperty('--shift', ((li.offsetWidth - OPEN_W) / 2) + 'px');
    row.classList.add('celebrate');
    cardOf(li).style.transform = 'translateX(-101%)';
    updateCounts(true);
    toast('Finished “' + short(t.title) + '”', 'Undo', restore);

    if (!reduce) {
      const r = li.getBoundingClientRect();
      setTimeout(() => burst(r.left + r.width / 2, r.top + r.height / 2), 150);
    }
    setTimeout(() => collapse(li), reduce ? 150 : 650);
  }

  function collapse(li) {
    li.style.height = li.offsetHeight + 'px';
    void li.offsetHeight;
    li.classList.add('collapse');
    setTimeout(() => { li.remove(); syncEmpty(); }, reduce ? 30 : 340);
  }

  function restore() {
    if (!lastRemoved) return;
    const { task, idx, doneId } = lastRemoved;
    lastRemoved = null;
    if (doneId) state.done = state.done.filter(d => d.id !== doneId);
    state.tasks.splice(Math.min(idx, state.tasks.length), 0, task);
    persist(); render(); hideToast();
  }

  function deleteTask(id) {
    const idx = state.tasks.findIndex(t => t.id === id); if (idx < 0) return;
    const t = state.tasks[idx];
    state.tasks.splice(idx, 1);
    lastRemoved = { task: t, idx };
    persist();
    const li = rows.get(id); rows.delete(id);
    if (li) { li.classList.add('leaving'); collapse(li); }
    updateCounts(); syncEmpty();
    toast('Task deleted', 'Undo', restore);
  }

  /* ---------- Toast ---------- */
  const toastEl = $('#toast'), toastMsg = $('#toast-msg'), toastAct = $('#toast-act');
  let toastTimer = 0, toastFn = null;
  function toast(msg, label, fn) {
    toastMsg.textContent = msg;
    toastFn = fn || null;
    toastAct.hidden = !label;
    toastAct.textContent = label || '';
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, 5000);
  }
  function hideToast() { toastEl.classList.remove('show'); clearTimeout(toastTimer); }
  toastAct.addEventListener('click', () => { const f = toastFn; hideToast(); if (f) f(); });

  /* ---------- Details sheet ---------- */
  const sheet = $('#sheet'), scrim = $('#scrim'), sTitle = $('#s-title'), sNote = $('#s-note');
  let origTitle = '';
  function openSheet(id, focusNote) {
    const t = find(id); if (!t) return;
    closeOpenRow(); hideToast();
    sheetId = id; origTitle = t.title;
    sTitle.value = t.title; sNote.value = t.note; growTitle();
    sheet.querySelectorAll('input[name="st"]').forEach(r => { r.checked = r.value === t.state; });
    sheet.classList.add('open'); scrim.classList.add('open');
    if (focusNote) setTimeout(() => sNote.focus(), 120);
    else $('#sheet-close').focus({ preventScroll: true });
  }
  function closeSheet() {
    const t = find(sheetId);
    if (t) {
      if (!t.title.trim()) { t.title = origTitle; }
      persist(); const li = rows.get(t.id); if (li) updateRow(li, t); updateCounts();
    }
    sheetId = null;
    sheet.classList.remove('open'); scrim.classList.remove('open');
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  }
  function liveEdit(fn) {
    const t = find(sheetId); if (!t) return;
    fn(t); persist();
    const li = rows.get(t.id); if (li) updateRow(li, t);
    updateCounts();
  }
  function growTitle() { sTitle.style.height = 'auto'; sTitle.style.height = sTitle.scrollHeight + 'px'; }
  sTitle.addEventListener('input', () => { growTitle(); liveEdit(t => { t.title = sTitle.value; }); });
  sNote.addEventListener('input', () => liveEdit(t => { t.note = sNote.value; }));
  sTitle.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); closeSheet(); } });
  sheet.addEventListener('change', e => { if (e.target.name === 'st') liveEdit(t => { t.state = e.target.value; }); });
  $('#sheet-close').addEventListener('click', closeSheet);
  scrim.addEventListener('click', closeSheet);
  $('#s-finish').addEventListener('click', () => { const id = sheetId; closeSheet(); setTimeout(() => finish(id), 330); });
  $('#s-delete').addEventListener('click', () => { const id = sheetId; closeSheet(); setTimeout(() => deleteTask(id), 200); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheetId) closeSheet(); });
  if (window.visualViewport) {
    const adjust = () => {
      const v = window.visualViewport;
      sheet.style.bottom = Math.max(0, window.innerHeight - v.height - v.offsetTop) + 'px';
      sheet.style.maxHeight = Math.round(v.height * 0.92) + 'px';
    };
    window.visualViewport.addEventListener('resize', adjust);
    window.visualViewport.addEventListener('scroll', adjust);
  }

  /* ---------- Confetti ---------- */
  const cv = $('#confetti'), ctx = cv.getContext('2d');
  const COLORS = ['#1FB67A', '#F2B23E', '#5B86F0', '#EC5C86', '#8F6BEF', '#FF8A4C'];
  let parts = [], raf = 0, lastT = 0;
  function sizeCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(window.innerWidth * dpr); cv.height = Math.round(window.innerHeight * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function burst(x, y) {
    sizeCanvas();
    for (let i = 0; i < 52; i++) {
      const a = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.25;
      const s = 5 + Math.random() * 9;
      parts.push({
        x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        w: 6 + Math.random() * 6, rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.45,
        c: COLORS[i % COLORS.length], round: Math.random() < 0.3, age: 0
      });
    }
    if (!raf) { lastT = performance.now(); raf = requestAnimationFrame(tick); }
  }
  function tick(now) {
    const dt = Math.min(48, now - lastT); lastT = now;
    const f = dt / 16.7;
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    parts = parts.filter(p => p.age < 1500);
    for (const p of parts) {
      p.age += dt;
      p.vy += 0.34 * f; p.vx *= Math.pow(0.985, f); p.vy *= Math.pow(0.992, f);
      p.x += p.vx * f; p.y += p.vy * f; p.rot += p.vr * f;
      ctx.globalAlpha = p.age > 950 ? Math.max(0, 1 - (p.age - 950) / 550) : 1;
      ctx.fillStyle = p.c;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      if (p.round) { ctx.beginPath(); ctx.arc(0, 0, p.w / 2.4, 0, 6.28); ctx.fill(); }
      else ctx.fillRect(-p.w / 2, -p.w / 4, p.w, p.w / 2);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    if (parts.length) raf = requestAnimationFrame(tick);
    else { raf = 0; ctx.clearRect(0, 0, window.innerWidth, window.innerHeight); }
  }

  /* ---------- Start ---------- */
  render();
  renderDate();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) renderDate(); });
})();
</script>
<script>if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}</script>
</body>
